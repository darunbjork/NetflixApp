<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmFokus - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="./css/navbar.css" />
    <link rel="stylesheet" href="./css/dark-lightmode.css">
    <link rel="stylesheet" href="./css/mobile-navbar.css">
    <link rel="stylesheet" href="./css/auth-links.css">
  </head>
  <body>

    <header>
     
        <a href="index.html" class="logo-link">
          <img src="./img/Film-Fokus.png" alt="Logotyp FilmFokus" />
        </a>

      <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </label>

      <nav id="navbar">
        <a href="index.html">Hem</a>
        <a href="filmer.html">Filmer</a>
        <a href="premiärer.html">Premiärer</a>
        <a href="profile.html">Profile</a>
        <div class="dropdown">
          <button class="dropbtn">Mer <i class="fas fa-caret-down"></i></button>
          <div class="dropdown-content">
            <a href="om-oss.html">Om oss</a>
            <a href="kontakt.html">Kontakt</a>
          </div>
        </div>
        <button id="darkToggle">☀️ Switch to Dark</button>
        <div class="dropdown auth-dropdown">
          <button class="dropbtn">Account <i class="fas fa-caret-down"></i></button>
          <div class="dropdown-content" id="auth-dropdown-content">
            
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="auth-container">
        <h2>Login</h2>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required />
          </div>
          <button type="submit" class="form-submit-btn">Login</button>
          <p id="loginStatus" class="form-status"></p>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <footer>
      <p>© 2025 Film Fokus | Alla rättigheter reserverade</p>
      <a href="#">Integritetspolicy</a> | <a href="#">Cookies</a>
    </footer>
  </body>
</html>
